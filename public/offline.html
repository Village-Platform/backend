<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>لا يوجد اتصال · أجهور الكبرى</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: "Cairo", system-ui, sans-serif; text-align: center;
      background: #ffffff; color: #0b3727;
    }
    @media (prefers-color-scheme: dark) { body { background: #091410; color: #e6f0eb; } }
    main { padding: 24px; max-width: 360px; }
    img { width: 96px; height: auto; }
    h1 { font-size: 1.25rem; margin: 16px 0 8px; }
    p { margin: 0 0 20px; opacity: .75; line-height: 1.7; }
    button {
      font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 10px 22px;
      background: #0f9b6c; color: #ffffff; cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img src="/brand/web/mark.png" alt="">
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>لوحة الإدارة تحتاج إلى اتصال لعرض البيانات الحالية. تحقق من الشبكة ثم أعد المحاولة.</p>
    <button type="button" onclick="location.reload()">إعادة المحاولة</button>
  </main>
</body>
</html>
