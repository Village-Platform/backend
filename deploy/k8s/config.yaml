# Non-secret settings. Secrets (SECRET_KEY_BASE, CRON_SECRET, POSTGRES_PASSWORD, SUPER_ADMIN_PASSWORD)
# live in the "village-env" Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: village-config
data:
  RAILS_ENV: production
  RAILS_MAX_THREADS: "3"
  # Background jobs (push notifications, scheduled campaigns) run in Solid Queue processes forked by
  # Puma. Move them to their own Deployment when campaigns start competing with web requests.
  SOLID_QUEUE_IN_PUMA: "1"
  # "1" = every /api/v1 call needs a user or guest token. Flip it once aghour.auth.tokenless_requests
  # {result="allowed"} is near zero, i.e. old app versions are gone; set it back to "0" to roll back.
  API_TOKEN_REQUIRED: "1"
  REVIEWER_MFA_MODE: "required"
  ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: "v9JIWmtSgeDPcG7KtZzmsazZWlVNKpxX"
  ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: "bbacsuddykgzfEvNTBbfU0gjZqjh6S5V"
  ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: "y4i7r499LFVbdRNA45G1qlKgoyM0Tgsu"
  RAILS_LOG_LEVEL: info
  CORS_ORIGINS: "*"
  SUPER_ADMIN_PHONE: "01017102923"
  SUPER_ADMIN_PASSWORD: "Password1"
  INSTAPAY_ADDRESS: "01287303441"
  VODAFONE_CASH_NUMBER: "01017102923"
  # Files go to PostgreSQL (stored_files) so the web pod stays stateless.
  ACTIVE_STORAGE_SERVICE: database
  # Cloudflare terminates TLS for aghour.dorfsys.com. ASSUME_SSL makes Rails treat every request as
  # HTTPS (also the CronJob's in-cluster http://web call), so FORCE_SSL adds HSTS and secure cookies
  # without redirecting.
  ASSUME_SSL: "1"
  FORCE_SSL: "1"
  # Telemetry to the collector in deploy/observability (installed). Comment the endpoint out to stop
  # exporting; without it the app sends nothing.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc:4318
  OTEL_SERVICE_NAME: aghour-api
  OTEL_METRIC_EXPORT_INTERVAL: "30000"
  OTEL_TRACES_SAMPLER: parentbased_traceidratio
  OTEL_TRACES_SAMPLER_ARG: "1.0"
